<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>jobq</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1b1f24;--muted:#667085;--line:#dde1e6;--accent:#2563eb;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#1a1f26;--text:#e6e8eb;--muted:#98a2b3;--line:#2a3139}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}h1{margin:0 0 10px}.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}.stat b{font-size:22px;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{color:var(--muted);font-weight:600}
.s{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
.s-queued{background:#dbeafe;color:#1e3a8a}.s-running{background:#fef3c7;color:#92400e}.s-succeeded{background:#dcfce7;color:#166534}.s-failed{background:#ffe4d6;color:#9a3412}.s-dead{background:#fde2e2;color:#991b1b}.s-cancelled{background:#e5e7eb;color:#374151}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:6px;padding:3px 8px;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text)}
code{font-size:12px}
</style></head><body><div class="wrap">
<h1>jobq</h1><p class="muted">Persistent job queue on SQLite. Refreshes every 2 seconds.</p>
<div class="stats" id="stats"></div>
<div class="card"><div class="row"><strong>Enqueue</strong><input id="type" placeholder="type, e.g. email.send"><input id="payload" placeholder='payload JSON, e.g. {"to":"a@b.c"}' style="flex:1"><input id="prio" type="number" placeholder="priority" style="width:90px"><input id="delay" type="number" placeholder="delay ms" style="width:100px"><button class="primary" id="enq">Add job</button></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><strong>Jobs</strong><select id="filter"><option value="">all states</option><option>queued</option><option>running</option><option>succeeded</option><option>failed</option><option>dead</option><option>cancelled</option></select></div>
<table><thead><tr><th>id</th><th>type</th><th>state</th><th>attempts</th><th>run at</th><th>last error</th><th></th></tr></thead><tbody id="jobs"></tbody></table></div>
<div class="card"><strong>Schedules</strong><table><thead><tr><th>name</th><th>cron</th><th>type</th><th>next run</th><th>enabled</th><th></th></tr></thead><tbody id="scheds"></tbody></table></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function j(u,o){const r=await fetch(u,o);return r.status===204?null:r.json()}
async function refresh(){
  const s=await j('/api/stats');$('#stats').innerHTML=Object.entries(s.byState).map(([k,v])=>`<div class="stat"><b>${v}</b><span class="s s-${k}">${k}</span></div>`).join('');
  const st=$('#filter').value;const jobs=await j('/api/jobs?limit=100'+(st?'&state='+st:''));
  $('#jobs').innerHTML=jobs.map(x=>`<tr><td>${x.id}</td><td><code>${esc(x.type)}</code></td><td><span class="s s-${x.state}">${x.state}</span></td><td>${x.attempts}/${x.max_attempts}</td><td class="muted">${x.run_at.slice(0,19).replace('T',' ')}</td><td class="muted">${esc(x.last_error||'')}</td><td>${x.state==='dead'?`<button data-a="retry" data-id="${x.id}">retry</button>`:''}${['queued','failed'].includes(x.state)?`<button data-a="cancel" data-id="${x.id}">cancel</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7 class="muted">no jobs</td></tr>';
  const sc=await j('/api/schedules');$('#scheds').innerHTML=sc.map(x=>`<tr><td>${esc(x.name)}</td><td><code>${esc(x.cron)}</code></td><td><code>${esc(x.type)}</code></td><td class="muted">${x.next_run_at.slice(0,16).replace('T',' ')} UTC</td><td>${x.enabled?'yes':'no'}</td><td><button data-s="${x.enabled?'disable':'enable'}" data-n="${esc(x.name)}">${x.enabled?'disable':'enable'}</button> <button data-s="delete" data-n="${esc(x.name)}">delete</button></td></tr>`).join('')||'<tr><td colspan=6 class="muted">no schedules</td></tr>';
}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a){await j(`/api/jobs/${b.dataset.id}/${b.dataset.a}`,{method:'POST'});refresh()}
  if(b.dataset.s){await j(b.dataset.s==='delete'?`/api/schedules/${encodeURIComponent(b.dataset.n)}`:`/api/schedules/${encodeURIComponent(b.dataset.n)}/${b.dataset.s}`,{method:b.dataset.s==='delete'?'DELETE':'POST'});refresh()}});
$('#enq').onclick=async()=>{let payload={};try{payload=$('#payload').value?JSON.parse($('#payload').value):{}}catch{return alert('payload must be JSON')}
  const body={type:$('#type').value,payload};if($('#prio').value)body.priority=+$('#prio').value;if($('#delay').value)body.delayMs=+$('#delay').value;
  const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)alert(JSON.stringify((await r.json()).details||'error'));refresh()};
$('#filter').onchange=refresh;refresh();setInterval(refresh,2000);
</script></div></body></html>
